name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify generated master
        run: node build-master.mjs --check

      - name: Run repository verifier
        run: node verify-master.mjs

      - name: Check JavaScript syntax
        run: |
          node --check build-master.mjs
          node --check refresh-source-lock.mjs
          node --check verify-master.mjs
          node --check youtube-master-suite.user.js
          for source in sources/modules/*.user.js; do
            node --check "$source"
          done

      - name: Confirm verification made no changes
        run: git diff --exit-code
